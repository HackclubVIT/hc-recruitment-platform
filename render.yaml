services:
  # Next.js Web Frontend
  - type: web
    name: hc-recruitment-website
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile --prod=false && pnpm build
    startCommand: npx serve out -s -l $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: JWT_SECRET
        sync: false

  # Express + Prisma API Backend
  - type: web
    name: hc-recruitment-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOW_USER_CREATION
        value: "true"
